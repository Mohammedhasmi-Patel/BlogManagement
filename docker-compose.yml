services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: blogmanagement-api:latest
    container_name: blogmanagement_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - blog_uploads:/app/wwwroot/uploads

volumes:
  blog_uploads:
    driver: local
